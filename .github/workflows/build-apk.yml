name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails in seconds with a clear message if a file was not uploaded to the repo
      - name: Check that all project files exist
        run: |
          missing=0
          for f in App.js index.js checker.js phonetics.js sentences.js vocab.json \
                   package.json app.json babel.config.js \
                   plugins/withSplashColor.js scripts/make-vocab.js; do
            if [ ! -f "$f" ]; then echo "MISSING FILE: $f"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "Upload the missing file(s) to the TOP LEVEL of the repo (not inside a subfolder)."
            exit 1
          fi
          echo "All project files are present."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Check native modules are installed
        run: |
          for m in react-native-vosk react-native-ble-plx expo-speech expo-status-bar; do
            test -d "node_modules/$m" || { echo "MISSING PACKAGE: $m - fix package.json"; exit 1; }
          done

      # ---- Offline speech model (stored in the APK, no internet needed on the phone) ----
      - name: Cache speech model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: assets/model-en-us
          key: vosk-model-small-en-us-0.15

      - name: Download speech model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p assets
          curl -fL --retry 5 --retry-delay 5 -o model.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mv vosk-model-small-en-us-0.15 assets/model-en-us
          rm model.zip

      - name: Check speech model
        run: |
          ls assets/model-en-us
          test -d assets/model-en-us/am && test -d assets/model-en-us/graph \
            || { echo "Speech model folder looks wrong"; exit 1; }

      - name: Skip sentences the model cannot hear
        run: node scripts/make-vocab.js assets/model-en-us

      # Bundles the JavaScript on its own so errors (missing imports, typos) are readable
      - name: Check JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/bundle-check

      # ---- Android build ----
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Give Gradle more memory
        run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: speak-it-right-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
