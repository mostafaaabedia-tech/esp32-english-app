name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      EAS_BUILD_PROFILE: preview

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Start EAS build
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          eas build --platform android --profile "$EAS_BUILD_PROFILE" --non-interactive --no-wait

      - name: Wait & download latest finished APK URL
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          for i in {1..10}; do
            echo "Checking for finished builds (attempt $i)..."
            builds_json=$(eas build:list --platform android --limit 5 --json)
            apk_url=$(echo "$builds_json" | jq -r 'map(select(.status=="finished")) | .[0].artifacts.android.url // empty')
            if [ -n "$apk_url" ]; then
              echo "Found APK URL: $apk_url"
              curl -L "$apk_url" -o app-latest.apk
              ls -lh app-latest.apk
              exit 0
            fi
            sleep 30
          done
          echo "APK not available after polling; check the EAS build dashboard for details."
          exit 1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: speak-it-right-apk
          path: app-latest.apk
          if-no-files-found: error
